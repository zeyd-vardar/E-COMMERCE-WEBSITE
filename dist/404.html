<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STORE</title>
    <script>
      const basePath = '/E-COMMERCE-WEBSITE';
      const route = window.location.pathname.startsWith(basePath)
        ? window.location.pathname.slice(basePath.length) || '/'
        : '/';
      window.location.replace(
        `${basePath}/?redirect=${encodeURIComponent(route + window.location.search + window.location.hash)}`,
      );
    </script>
  </head>
  <body></body>
</html>
