services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storefront}
      POSTGRES_USER: ${POSTGRES_USER:-store}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-store_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_initial_schema.sql:ro
      - ./database/seeds/001_demo_catalog.sql:/docker-entrypoint-initdb.d/02_demo_catalog.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    command: npm run api:start
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://$${POSTGRES_USER:-store}:$${POSTGRES_PASSWORD:-store_local_password}@db:5432/$${POSTGRES_DB:-storefront}
      JWT_SECRET: ${JWT_SECRET:-replace-me-before-production}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
    ports: ['3001:3001']
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
